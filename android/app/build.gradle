plugins {
    id "com.android.application"
}

android {
    namespace "dev.openlite.mobile"
    compileSdk 34

    defaultConfig {
        applicationId "dev.openlite.mobile"
        minSdk 26
        targetSdk 34
        // Numbered by build.ps1 -Release so each published APK installs
        // over the last.
        versionCode((project.findProperty("openliteVersionCode") ?: "1") as int)
        versionName "0.2"
    }

    // Debug and release builds are both signed with this PC's debug key, so
    // the published APK installs over one put on by USB and the reverse.
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // The web bundle is served as-is.
        noCompress "js", "html"
    }
}

dependencies {
    implementation "org.apache.commons:commons-compress:1.26.2"
}
